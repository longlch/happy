apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name}}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name}}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: {{ .Values.name}}
      tier: frontend
  template:
    metadata:
      labels:
        app: {{ .Values.name}}
        tier: frontend
    spec: # Pod spec
      containers:
        - name: mycontainer
          image: {{ .Values.image.name }}:{{ .Values.image.tag}}
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: {{ .Values.configmap.name }}
          resources:
            requests:
              memory: "16Mi"
              cpu: "50m"    # 50 milli cores (1/20 CPU)
            limits:
              memory: "128Mi" # 128 mebibytes
              cpu: "100m"