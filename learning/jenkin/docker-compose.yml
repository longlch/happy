version: "3.9"

services:
  lph-jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lph-jenkins
    restart: unless-stopped
    privileged: true
    user: root
    ports:
      - 8080:8080
      - 50000:50000
    volumes:
      - /Users/longhoangphan/project/jenkin/jenkins_configuration:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - jenkins

networks:
  jenkins: