---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-deployment
  labels:
    app: url-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: url-app
  template:
    metadata:
      labels:
        app: url-app
    spec:
      containers:
        - image: xcoulon/go-url-shortener:0.1.0
          name: go-url-shortener
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: my-config
                  key: DATABASE_HOST
            #              value: postgres-service # Work ok
            #              value:  10.244.120.67 # Work ok
            #              value: http://postgres-service.default.svc.cluster.local # Not Work: due to this 2 implies an HTTP connection, but PostgreSQL uses TCP for its connections. This mismatch can cause errors.
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: my-config
                  key: DATABASE_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: my-secret
                  key: DATABASE_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: my-secret
                  key: DATABASE_PASSWORD
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: url-service-network
spec:
  type: NodePort
  selector:
    app: url-app
  ports:
    - nodePort: 31317
      port: 8080
      protocol: TCP
      targetPort: 8080