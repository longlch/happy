#write cloud build
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'build', '-t', 'asia-east1-docker.pkg.dev/happy-427410/happy-dev/my-image', '.' ]
  # Docker Push
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'push',
            'asia-east1-docker.pkg.dev/happy-427410/happy-dev/my-image' ]
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [ 'run', 'deploy', 'happy', '--image', 'asia-east1-docker.pkg.dev/happy-427410/happy-dev/my-image', '--region', 'asia-east1' ]
images:
  - asia-east1-docker.pkg.dev/happy-427410/happy-dev/my-image