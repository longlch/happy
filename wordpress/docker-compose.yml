version: "3.3"

services:
  nginx:
    depends_on:
      - onereels
    image: nginx:alpine
    container_name: webserver
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-config/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot --force-renewal --email hoanglonglch@gmail.com -d lph.com --agree-tos
    networks:
      - app-network

  website:
    image: wordpress
    depends_on:
      - db
    environment:
      - WORDPRESS_DB_HOST=db
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=wordpress
      - WORDPRESS_DB_NAME=wordpress
    volumes:
      - ./php-config/upload.ini:/usr/local/etc/php/conf.d/upload.ini
      - ./php-config/backup-onereels.wpress:/var/www/html/wp-content/ai1wm-backups/backup.wpress
    networks:
      - app-network

  db:
    image: mariadb:10.6.4-focal
    command: "--default-authentication-plugin=mysql_native_password"
    volumes:
      - onereels_db_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=wordpress
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=wordpress
      - MYSQL_PASSWORD=wordpress
    ports:
      - 3306:3306
    expose:
      - 3306
      - 33060
    networks:
      - app-network

volumes:
  onereels_db_data:


networks:
  app-network:
    driver: bridge