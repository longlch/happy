---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-service-deployment
  namespace: development
  labels:
    app: quote-service-info
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quote-service-info
  template:
    metadata:
      labels:
        app: quote-service-info
    spec:
      containers:
        - name: quote-container
          image: datawire/quote:0.5.0
          ports:
            - containerPort: 8080
