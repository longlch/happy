---
apiVersion: v1
kind: Deployment
metadata:
  name: quote-service-name #Deployment name
  namespace: development
  labels:
    app: quote-service-label
spec:
  replicas: 2
  selector:
    matchLabels:
      name: quote-pod
    template:
      metadata:
        name: quote-pod
        labels:
          app: quote-service-pod-label
    spec:
      containers:
        - name: quote-container
          image: datawire/quote:0.5.0
          ports:
            - containerPort: 8080

